[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakh-model-lab"
version = "0.1.0"
description = "Offline-first reproducible model evaluation laboratory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.16,<0.17",
    "textual>=8.2,<9",
]

[project.scripts]
model-lab = "model_lab.cli:main"

[tool.setuptools.packages.find]
include = ["model_lab*", "contracts*"]

[tool.setuptools.package-data]
"model_lab.optimization.harness" = ["*.json"]
contracts = ["*.json", "fixtures/*.json"]

[tool.setuptools.data-files]
"share/parakh/benchmarks" = ["benchmarks/seed_cases.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "B"]

[tool.pyright]
pythonVersion = "3.12"
include = ["model_lab", "tests"]
venvPath = "."
venv = ".venv"

