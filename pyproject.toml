[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakh-model-lab"
version = "0.1.0"
description = "Offline-first reproducible model evaluation laboratory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
model-lab = "model_lab.cli:main"

[tool.setuptools.packages.find]
include = ["model_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

